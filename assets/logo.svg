<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff6b1a"/>
      <stop offset="60%" stop-color="#ff6b1a"/>
      <stop offset="100%" stop-color="#39d8ff"/>
    </linearGradient>
    <linearGradient id="nozzleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e6df"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
  </defs>

  <!-- Background square -->
  <rect x="0" y="0" width="256" height="256" fill="#0d0f14"/>

  <!-- Outer mechanical frame -->
  <polygon points="20,20 236,20 236,236 20,236" fill="none" stroke="#e8e6df" stroke-width="3"/>
  <polygon points="28,28 228,28 228,228 28,228" fill="none" stroke="#39d8ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Corner mechanical accents -->
  <polyline points="20,44 20,20 44,20" fill="none" stroke="#ff6b1a" stroke-width="4"/>
  <polyline points="236,44 236,20 212,20" fill="none" stroke="#ff6b1a" stroke-width="4"/>
  <polyline points="20,212 20,236 44,236" fill="none" stroke="#ff6b1a" stroke-width="4"/>
  <polyline points="236,212 236,236 212,236" fill="none" stroke="#ff6b1a" stroke-width="4"/>

  <!-- Rivets -->
  <circle cx="36" cy="36" r="3" fill="#39d8ff"/>
  <circle cx="220" cy="36" r="3" fill="#39d8ff"/>
  <circle cx="36" cy="220" r="3" fill="#39d8ff"/>
  <circle cx="220" cy="220" r="3" fill="#39d8ff"/>

  <!-- Diagonal energy slash -->
  <polygon points="40,216 216,40 224,48 48,224" fill="#39d8ff" opacity="0.08"/>

  <!-- ====== MAIN SYMBOL: Rocket Nozzle + Wrench + Flame ====== -->

  <!-- Wrench handle (angled, mechanical) -->
  <polygon points="108,170 148,170 148,210 108,210" fill="none" stroke="#e8e6df" stroke-width="0"/>
  <path d="M114,174 L114,206 L142,206 L142,174 Z" fill="#e8e6df" opacity="0.9"/>
  <!-- Wrench grip ridges -->
  <line x1="118" y1="178" x2="138" y2="178" stroke="#0d0f14" stroke-width="2"/>
  <line x1="118" y1="184" x2="138" y2="184" stroke="#0d0f14" stroke-width="2"/>
  <line x1="118" y1="190" x2="138" y2="190" stroke="#0d0f14" stroke-width="2"/>
  <line x1="118" y1="196" x2="138" y2="196" stroke="#0d0f14" stroke-width="2"/>
  <line x1="118" y1="202" x2="138" y2="202" stroke="#0d0f14" stroke-width="2"/>

  <!-- Wrench head - C-shaped jaw integrated with nozzle base -->
  <path d="M108,174 L108,140 Q108,118 128,118 Q148,118 148,140 L148,174"
        fill="none" stroke="#e8e6df" stroke-width="10" stroke-linecap="butt"/>
  <!-- Wrench jaw notch -->
  <rect x="120" y="130" width="16" height="14" fill="#0d0f14"/>
  <rect x="122" y="132" width="12" height="10" fill="#39d8ff" opacity="0.3"/>

  <!-- Nozzle body (tapered trapezoid) -->
  <polygon points="104,118 152,118 162,84 94,84" fill="#0d0f14" stroke="#e8e6df" stroke-width="3"/>
  <!-- Nozzle inner glow -->
  <polygon points="112,114 144,114 152,90 104,90" fill="#ff6b1a" opacity="0.15"/>

  <!-- Nozzle flange top -->
  <rect x="88" y="78" width="80" height="10" fill="#e8e6df"/>
  <rect x="92" y="80" width="72" height="6" fill="#0d0f14"/>
  <rect x="96" y="81" width="64" height="4" fill="#39d8ff" opacity="0.6"/>

  <!-- Nozzle mechanical detailing -->
  <line x1="100" y1="88" x2="100" y2="114" stroke="#39d8ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="156" y1="88" x2="156" y2="114" stroke="#39d8ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Expanding nozzle cone (bottom) -->
  <polygon points="104,118 152,118 166,148 90,148" fill="#0d0f14" stroke="#e8e6df" stroke-width="3"/>
  <!-- Cone inner -->
  <polygon points="112,120 144,120 156,144 100,144" fill="#ff6b1a" opacity="0.2"/>
  <!-- Cone vertical details -->
  <line x1="110" y1="122" x2="102" y2="144" stroke="#39d8ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="128" y1="120" x2="128" y2="144" stroke="#39d8ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="146" y1="122" x2="154" y2="144" stroke="#39d8ff" stroke-width="1.5" opacity="0.6"/>

  <!-- ====== JAGGED FLAME THRUST (upward) ====== -->
  <!-- Main flame body -->
  <polygon points="128,78 118,50 128,62 114,32 128,50 124,18 128,38 132,18 128,50 142,32 128,62 138,50"
           fill="url(#flameGrad)"/>
  <!-- Inner flame core -->
  <polygon points="128,74 122,56 128,64 124,44 128,54 128,54 132,44 128,64 134,56"
           fill="#ff6b1a" opacity="0.9"/>
  <!-- White-hot tip -->
  <polygon points="128,44 126,32 128,38 130,32" fill="#e8e6df" opacity="0.8"/>

  <!-- Side flame tongues (left) -->
  <polygon points="100,84 88,58 96,68 84,44 96,58 94,34 100,52 108,40 100,68 108,58"
           fill="#ff6b1a" opacity="0.6"/>
  <!-- Side flame tongues (right) -->
  <polygon points="156,84 168,58 160,68 172,44 160,58 162,34 156,52 148,40 156,68 148,58"
           fill="#39d8ff" opacity="0.5"/>

  <!-- ====== ELECTRICAL / HIGH-VOLTAGE DETAILS ====== -->
  <!-- Lightning bolt left -->
  <polyline points="72,100 84,108 78,112 90,120 84,124 96,132" fill="none" stroke="#39d8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lightning bolt right -->
  <polyline points="184,100 172,108 178,112 166,120 172,124 160,132" fill="none" stroke="#ff6b1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small electrical sparks -->
  <line x1="66" y1="92" x2="58" y2="86" stroke="#39d8ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="190" y1="92" x2="198" y2="86" stroke="#39d8ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="140" x2="60" y2="146" stroke="#ff6b1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="186" y1="140" x2="196" y2="146" stroke="#ff6b1a" stroke-width="2" stroke-linecap="round"/>

  <!-- ====== BOTTOM INDUSTRIAL BASE ====== -->
  <rect x="96" y="148" width="64" height="6" fill="#e8e6df"/>
  <rect x="100" y="154" width="56" height="4" fill="#39d8ff" opacity="0.4"/>

  <!-- Small text at bottom -->
  <text x="128" y="232" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold"
        fill="#e8e6df" letter-spacing="3" opacity="0.6">RL-TRAINER</text>
</svg>
